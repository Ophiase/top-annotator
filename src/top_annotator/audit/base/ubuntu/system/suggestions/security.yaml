# top-annotator cache (ubuntu/system/suggestions/security); safe to edit and share.
# Signature = process name | executable (or argv[0]) [| script].
annotations:
  auditd|/usr/sbin/auditd:
    category: safe
    note: 'Linux audit daemon: records system calls the rules name; shipped by the Ubuntu package `auditd`
      at `/usr/sbin/auditd`. Package-managed, so `dpkg -V auditd` is the integrity check.'
    provider: distro
    updated: '2026-11-11'
