# top-annotator cache (ubuntu/gnome/portals); safe to edit and share.
# Signature = process name | executable (or argv[0]) [| script].
annotations:
  flatpak-portal|/usr/libexec/flatpak-portal:
    category: safe
    note: Flatpak portal, the D-Bus service that lets a sandboxed app spawn sandboxed children (user unit
      `flatpak-portal.service`); shipped by the Pop!_OS package `flatpak` (apt.pop-os.org/release) at
      `/usr/libexec/flatpak-portal`. Package-managed, so `dpkg -V flatpak` is the integrity check.
    provider: desktop
    updated: '2026-11-11'
  flatpak-session|/usr/libexec/flatpak-session-helper:
    category: safe
    note: Flatpak session helper; shipped by the Ubuntu package `flatpak` at `/usr/libexec/flatpak-session-helper`.
      Package-managed, so `dpkg -V flatpak` is the integrity check.
    provider: desktop
    updated: '2026-11-01'
  p11-kit-server|/usr/libexec/p11-kit/p11-kit-server:
    category: safe
    note: PKCS#11 key bridge; shipped by the Ubuntu package `p11-kit` at `/usr/libexec/p11-kit/p11-kit-server`.
      Package-managed, so `dpkg -V p11-kit` is the integrity check.
    provider: desktop
    updated: '2026-11-01'
  p11-kit-remote|/usr/libexec/p11-kit/p11-kit-remote:
    category: safe
    note: PKCS#11 remoting helper started by `p11-kit-server` for Flatpak sandboxes, serving the read-only
      system trust store (`p11-kit-trust.so`, `write-protected=yes`); shipped by the Ubuntu package `p11-kit`
      at `/usr/libexec/p11-kit/p11-kit-remote`. Package-managed, so `dpkg -V p11-kit` is the integrity check.
    provider: desktop
    updated: '2026-11-11'
