# Manual only: run it from the Actions tab. Switch `on` to `push` and
# `pull_request` once the project has contributors.
name: check
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - run: uv tool install rumdl
      - run: uv sync --all-groups
      - run: just checks
      - name: Show the last commit to the guards as uncommitted changes
        run: git reset --soft HEAD~1
      - run: just guards

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - run: just audit
